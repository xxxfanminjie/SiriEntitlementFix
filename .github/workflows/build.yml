# SiriEntitlementFix —— GitHub Actions 云编译
# 用法：把本仓库根目录下的 Makefile + Tweak.x（control 可传可不传）传到 GitHub 仓库根目录，
#       再加上本文件（.github/workflows/build.yml），然后在 Actions 页 Run workflow，
#       几分钟后下载 Artifacts 里的 SiriEntitlementFix.dylib。

name: Build SiriEntitlementFix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + iOS SDK
        run: |
          sudo mkdir -p /opt/theos
          sudo chown -R "$USER" /opt/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          rm -rf /opt/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Install ldid (for signing)
        run: brew install ldid

      - name: Build
        env:
          THEOS: /opt/theos
        run: make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SiriEntitlementFix
          path: .theos/obj/debug/SiriEntitlementFix.dylib
